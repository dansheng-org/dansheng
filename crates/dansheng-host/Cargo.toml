[package]
name = "dansheng-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["services"]
services = ["dep:dansheng-connectors", "dep:log"]

[dependencies]
dansheng-core = { path = "../dansheng-core" }
dansheng-connectors = { path = "../dansheng-connectors", features = ["services"], optional = true }
# async-imap's wire trace contains credentials and bodies. Compile it out in
# native entry points, independent of runtime logger configuration.
log = { version = "0.4", features = ["max_level_info"], optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
uuid.workspace = true
sha2.workspace = true
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
async-trait.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
chrono.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
