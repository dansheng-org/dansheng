name: Rust core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --all-targets --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Worktree workflow integration fixtures
        shell: pwsh
        run: ./tools/workspace/tests/Test-Workspace.ps1
      - name: Dependency cache isolation fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/workspace/tests/Test-Environment.ps1
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: sdk
      - run: npm run check
        working-directory: sdk
      - run: node --test scripts/tests/runtime-paths.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;30.0.16138531'
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a -t x86_64 -p 24 build -p dansheng-ffi --release --locked
        env:
          ANDROID_NDK_VERSION: 30.0.16138531
