name: Rust core
on:
  workflow_call:
    inputs:
      smoke:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: core
jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Preserve required-check names; os is a display identity, not a runner label.
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            labels: [self-hosted, linux, x64, 1402ubuntu]
            hosted: [ubuntu-24.04]
          - os: windows-latest
            labels: [self-hosted, windows, x64, dansheng-win]
            hosted: [windows-2025]
    runs-on: ${{ github.repository == 'DANSHENG/dansheng' && matrix.labels || matrix.hosted }}
    env:
      # Keep native test binaries small; test assertions remain enabled.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/initialize-ci
        with:
          role: Native
      - name: Keep Windows test binaries small
        if: runner.os == 'Windows'
        run: |
          # GNU COFF symbol tables account for roughly a third of test EXE size.
          'CARGO_PROFILE_DEV_STRIP=symbols' >> $env:GITHUB_ENV
          'CARGO_PROFILE_TEST_STRIP=symbols' >> $env:GITHUB_ENV
      - name: Test affected-check scheduling
        if: runner.os == 'Linux' && !inputs.smoke
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/tests/AffectedChecks.Tests.ps1
      - name: Determine workspace fixture changes
        id: affected
        continue-on-error: true
        if: ${{ !inputs.smoke }}
        working-directory: ${{ github.workspace }}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_PATH: ${{ github.event_path }}
          CI_CHECKOUT_SHA: ${{ github.sha }}
          CI_CHECKOUT_REF: ${{ github.ref }}
        run: >-
          ./scripts/ci/Get-AffectedChecks.ps1 -RepositoryRoot .
          -EventName $env:CI_EVENT_NAME -EventPath $env:CI_EVENT_PATH
          -ExpectedSha $env:CI_CHECKOUT_SHA -ExpectedRef $env:CI_CHECKOUT_REF
      - run: cargo fmt --all -- --check
        if: ${{ !inputs.smoke }}
      - run: cargo test --workspace --all-features --all-targets --locked
        if: ${{ !inputs.smoke }}
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
        if: ${{ !inputs.smoke }}
      - name: Worktree workflow integration fixtures
        if: runner.os == 'Linux' && !inputs.smoke && (steps.affected.outcome != 'success' || steps.affected.outputs.workspace_fixtures != 'false')
        # Both suites run side by side in separate processes (see the script).
        run: ../scripts/ci/Invoke-WorkspaceFixtures.ps1 -CoreRoot . -OutputRoot $env:DANSHENG_TASK_RUNTIME
      - name: Dependency cache isolation fixtures
        if: runner.os == 'Windows' && !inputs.smoke && (steps.affected.outcome != 'success' || steps.affected.outputs.workspace_fixtures != 'false')
        run: ./tools/workspace/tests/Test-Environment.ps1 -OutputRoot (Join-Path $env:DANSHENG_TASK_RUNTIME 'environment-fixtures')
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
  sdk:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'DANSHENG/dansheng' && '["self-hosted","linux","x64","1402ubuntu"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/initialize-ci
        with:
          role: Sdk
      - run: npm ci --ignore-scripts
        if: ${{ !inputs.smoke }}
        working-directory: core/sdk
      - run: npm run check
        if: ${{ !inputs.smoke }}
        working-directory: core/sdk
      - run: node --test scripts/tests/runtime-paths.test.mjs
        if: ${{ !inputs.smoke }}
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'DANSHENG/dansheng' && '["self-hosted","linux","x64","1402ubuntu"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/initialize-ci
        with:
          role: Android
      - name: Build Android core libraries
        if: ${{ !inputs.smoke }}
        shell: bash
        run: |
          set -euo pipefail
          ndk_toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          for target in aarch64-linux-android x86_64-linux-android; do
            target_key="${target//-/_}"
            compiler="${ndk_toolchain}/bin/${target}24-clang"
            test -x "$compiler"
            export "CC_${target_key}=$compiler"
            export "CXX_${target_key}=${compiler}++"
            export "AR_${target_key}=${ndk_toolchain}/bin/llvm-ar"
            export "CARGO_TARGET_${target_key^^}_LINKER=$compiler"
            export "BINDGEN_EXTRA_CLANG_ARGS_${target_key}=--target=${target}24 --sysroot=${ndk_toolchain}/sysroot"
            export CLANG_PATH="$compiler"
            cargo build --package dansheng-ffi --target "$target" --release --locked
          done
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
