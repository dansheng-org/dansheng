name: Rust core
on:
  workflow_call:
    inputs:
      smoke:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: core
jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Preserve required-check names; os is a display identity, not a runner label.
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            labels: [self-hosted, linux, x64, 1402ubuntu]
          - os: windows-latest
            labels: [self-hosted, windows, x64, dansheng-win]
    runs-on: ${{ matrix.labels }}
    env:
      # Keep native test binaries small; test assertions remain enabled.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Windows environment
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Initialize-Runner.ps1 -Role Native
      - name: Initialize preinstalled Linux environment
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Native
      - run: cargo fmt --all -- --check
        if: ${{ !inputs.smoke }}
      - run: cargo test --workspace --all-features --all-targets --locked
        if: ${{ !inputs.smoke }}
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
        if: ${{ !inputs.smoke }}
      - name: Worktree workflow integration fixtures
        if: ${{ !inputs.smoke }}
        run: |
          ./tools/workspace/tests/Test-Workspace.ps1 -OutputDirectory (Join-Path $env:DANSHENG_TASK_RUNTIME 'workspace-fixtures')
          ./tools/workspace/tests/Test-Monorepo.ps1 -OutputDirectory (Join-Path $env:DANSHENG_TASK_RUNTIME 'monorepo-fixtures')
      - name: Dependency cache isolation fixtures
        if: runner.os == 'Windows' && !inputs.smoke
        run: ./tools/workspace/tests/Test-Environment.ps1 -OutputRoot (Join-Path $env:DANSHENG_TASK_RUNTIME 'environment-fixtures')
      - name: Remove this job's Rust build outputs
        if: always()
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-BuildOutputs.ps1
  sdk:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, 1402ubuntu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Sdk
      - run: npm ci --ignore-scripts
        if: ${{ !inputs.smoke }}
        working-directory: core/sdk
      - run: npm run check
        if: ${{ !inputs.smoke }}
        working-directory: core/sdk
      - run: node --test scripts/tests/runtime-paths.test.mjs
        if: ${{ !inputs.smoke }}
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, 1402ubuntu]
    env:
      ANDROID_NDK_VERSION: '30.0.16138531'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Android
      - name: Build Android core libraries
        if: ${{ !inputs.smoke }}
        shell: bash
        run: |
          set -euo pipefail
          ndk_toolchain="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          for target in aarch64-linux-android x86_64-linux-android; do
            target_key="${target//-/_}"
            compiler="${ndk_toolchain}/bin/${target}24-clang"
            test -x "$compiler"
            export "CC_${target_key}=$compiler"
            export "CXX_${target_key}=${compiler}++"
            export "AR_${target_key}=${ndk_toolchain}/bin/llvm-ar"
            export "CARGO_TARGET_${target_key^^}_LINKER=$compiler"
            export "BINDGEN_EXTRA_CLANG_ARGS_${target_key}=--target=${target}24 --sysroot=${ndk_toolchain}/sysroot"
            export CLANG_PATH="$compiler"
            cargo build --package dansheng-ffi --target "$target" --release --locked
          done
      - name: Remove this job's Rust build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-BuildOutputs.ps1
