name: App and Core checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke:
        description: Validate runner environments only (no build or release)
        type: boolean
        default: false
  workflow_call:
    inputs:
      smoke:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: app-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace-scripts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, dansheng-scripts]
    defaults:
      run:
        shell: bash
        working-directory: apps/dansheng_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Workspace
      - name: Core dependency path and payload fixtures
        if: ${{ !inputs.smoke }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File ../../scripts/ci/Test-WorkspaceScripts.ps1
          python ./scripts/tests/audit-paths.test.py
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
  flutter:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, 1402ubuntu]
    defaults:
      run:
        working-directory: apps/dansheng_app
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Flutter
      - name: Reject local Pub overrides
        if: ${{ !inputs.smoke }}
        shell: bash
        run: test ! -e pubspec_overrides.yaml
      - run: flutter pub get --enforce-lockfile
        if: ${{ !inputs.smoke }}
      - name: Check committed dependency resolution
        if: ${{ !inputs.smoke }}
        run: git diff --exit-code -- pubspec.lock
      - name: Check handwritten Dart formatting
        if: ${{ !inputs.smoke }}
        shell: pwsh
        run: ../../scripts/ci/Check-Format.ps1
      - run: flutter analyze
        if: ${{ !inputs.smoke }}
      - run: flutter test
        if: ${{ !inputs.smoke }}
      - name: Check Pigeon generation
        if: ${{ !inputs.smoke }}
        run: |
          dart run pigeon --input pigeons/dansheng.dart
          git diff --exit-code -- lib/bridge.g.dart android/app/src/main/kotlin/org/dansheng/app/Bridge.g.kt
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
  core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/core-ci.yml
    with:
      smoke: ${{ inputs.smoke || false }}
  android-source-sdk:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, 1402ubuntu]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: apps/dansheng_app
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role AndroidSource
      - name: Build exact checkout SDK and compile App Kotlin/Pigeon
        if: ${{ !inputs.smoke }}
        run: |
          # PRs use the checked-out merge commit, never an assumed head SHA.
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify checked-out source.' }
          ../../scripts/ci/Invoke-Android.ps1 -Mode SourceSdk -Commit $commit
          $native = Join-Path $env:DANSHENG_TASK_RUNTIME 'native-sdk'
          $core = (Resolve-Path '../../core').Path
          $lock = Join-Path $native 'core.lock.json'
          $env:DANSHENG_CORE_SDK_DIR = $native
          $env:DANSHENG_CORE_LOCK_FILE = $lock
          $env:DANSHENG_CORE_ROOT = Join-Path $native 'resources'
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked Pub resolution failed.' }
          flutter build apk --debug --target-platform android-arm64 --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'App Kotlin/Pigeon ARM64 compile failed.' }
          gradle -p android :app:testDebugUnitTest --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Android host unit tests failed.' }
          $debugDirectory = Join-Path $env:DANSHENG_TASK_RUNTIME 'artifacts/debug'
          New-Item -ItemType Directory -Path $debugDirectory | Out-Null
          $debugApk = Join-Path $debugDirectory 'app-debug.apk'
          Copy-Item -LiteralPath (Join-Path $PWD.Path 'build/app/outputs/flutter-apk/app-debug.apk') -Destination $debugApk
          . ./scripts/prerelease-common.ps1
          $null = Test-DanshengPrereleaseSdk -AppRoot $PWD.Path -CoreRoot $core -CoreToolsRoot (Join-Path $core 'tools/workspace') -ArtifactDirectory $native -LockFile $lock
          ./scripts/audit-apk.ps1 -Apk $debugApk -Abi arm64-v8a `
            -ArtifactDirectory $native -LockFile $lock -SdkOnly -Output (Join-Path $env:DANSHENG_TASK_RUNTIME 'apk-audit.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.smoke }}
        with:
          name: android-source-sdk-evidence
          path: |
            ${{ env.DANSHENG_TASK_RUNTIME }}/native-sdk/core.lock.json
            ${{ env.DANSHENG_TASK_RUNTIME }}/native-sdk/receipt.json
            ${{ env.DANSHENG_TASK_RUNTIME }}/apk-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
