name: Android Pre-release
on:
  workflow_run:
    workflows: [App and Core checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-prerelease-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/app-ci.yml
  build:
    needs: checks
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.checks.result == 'success'))
    runs-on: [self-hosted, linux, x64, 1402ubuntu]
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    defaults:
      run:
        shell: pwsh
        working-directory: apps/dansheng_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Release
      - name: Select exact App and Core identities
        id: identity
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/prerelease-common.ps1
          $commit = git rev-parse HEAD
          $identity = Get-DanshengPrereleaseIdentity -AppRoot $PWD.Path -Commit $commit
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "tag=$($identity.tag)" >> $env:GITHUB_OUTPUT
          "version=$($identity.version)" >> $env:GITHUB_OUTPUT
          "core=$commit" >> $env:GITHUB_OUTPUT
      - name: Test prerelease source and artifact safeguards
        run: ./scripts/tests/prerelease.tests.ps1
      - name: Verify existing release before building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          # A rerun must never replace assets or move an existing tag.
          # Targeted check for this exact tag instead of paginating through all historical releases.
          $existingTag = $null
          $tagQuery = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagQuery) { $existingTag = $tagQuery }
          $refs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reconcile existing tags.' }
          if ($existingTag -ceq $env:RELEASE_TAG -or $refs -ccontains "refs/tags/$env:RELEASE_TAG") {
            throw 'This commit already has a release. Inspect it before retrying; no overwrite is performed.'
          }
      - name: Build and verify SDK from exact checkout
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          ../../scripts/ci/Invoke-Android.ps1 -Mode SourceSdk -Commit $env:SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sdk-${{ steps.identity.outputs.commit }}
          path: |
            ${{ env.DANSHENG_TASK_RUNTIME }}/native-sdk/*.aar
            ${{ env.DANSHENG_TASK_RUNTIME }}/native-sdk/core.lock.json
            ${{ env.DANSHENG_TASK_RUNTIME }}/native-sdk/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Require persistent signing secrets
        env:
          KEYSTORE: ${{ secrets.DANSHENG_PRERELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DANSHENG_PRERELEASE_KEYSTORE_PASSWORD }}
        run: ../../scripts/ci/Write-Signing.ps1
      - name: Build, sign and audit ARM64 release APK
        env:
          DANSHENG_BETA_PASSWORD: ${{ secrets.DANSHENG_PRERELEASE_KEYSTORE_PASSWORD }}
        run: |
          ../../scripts/ci/Invoke-Android.ps1 -Mode Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-prerelease-${{ steps.identity.outputs.commit }}
          path: ${{ env.DANSHENG_TASK_RUNTIME }}/artifacts/review/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove this job's temporary signing files
        if: always()
        run: ../../scripts/ci/Clear-Signing.ps1
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE

  publish:
    needs: build
    # Automatic runs skip the manual checks job. Override inherited skip status,
    # while still requiring a successful audited build and a non-cancelled run.
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: [self-hosted, linux, x64, 1402ubuntu]
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Initialize preinstalled Linux environment
        shell: bash
        run: |
          set -euo pipefail
          : "${DANSHENG_CI_ROOT:?Runner parent must supply DANSHENG_CI_ROOT}"
          source "$DANSHENG_CI_ROOT/runner-env.sh"
          pwsh -NoLogo -NoProfile -File scripts/ci/Initialize-Runner.ps1 -Role Publish
      - name: Download audited release payload
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: android-prerelease-${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DANSHENG_TASK_RUNTIME/release"
          for attempt in 1 2 3 4; do
            echo "::group::Download attempt $attempt at $(date -u +%T)"
            staging="$DANSHENG_TASK_RUNTIME/release-download-$attempt"
            rm -rf "$staging"
            mkdir -p "$staging"
            # Guard gh run download with a 90-second timeout to prevent dead TCP hangs on cross-border CDN transfers.
            if timeout 90s gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$ARTIFACT_NAME" --dir "$staging" &&
              (cd "$staging" && sha256sum --check SHA256SUMS); then
              mv -T "$staging" "$DANSHENG_TASK_RUNTIME/release"
              echo "::endgroup::"
              echo "Release payload verified and downloaded successfully on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Release download attempt $attempt failed verification or timed out."
            rm -rf "$staging"
            if test "$attempt" -lt 4; then
              delay=$((attempt * 5))
              echo "Waiting ${delay}s before retry..."
              sleep "$delay"
            fi
          done
          echo "All release download attempts failed."
          exit 1
      - name: Create a draft, attach validated assets, then publish Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          APP_COMMIT: ${{ needs.build.outputs.commit }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$DANSHENG_TASK_RUNTIME/release"
          sha256sum --check SHA256SUMS
          for asset in ./*.apk SHA256SUMS build-info.json apk-audit.json signature.txt zipalign.txt release-notes.md core.lock.json core-receipt.json; do test -s "$asset"; done
          gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$APP_COMMIT" >/dev/null
          timeout 180s gh release create "$RELEASE_TAG" ./*.apk SHA256SUMS build-info.json apk-audit.json signature.txt zipalign.txt core.lock.json core-receipt.json release-notes.md \
            --verify-tag --title "Android $APP_VERSION Pre-release (${APP_COMMIT:0:12})" \
            --notes-file release-notes.md --draft --prerelease --latest=false
          timeout 60s gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Keep only this job's latest runtime and clean build outputs
        if: always()
        shell: pwsh
        run: ./scripts/ci/Clear-Runtime.ps1 -Checkout $env:GITHUB_WORKSPACE
