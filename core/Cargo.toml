[workspace]
members = ["crates/dansheng-core", "crates/dansheng-connectors", "crates/dansheng-host", "crates/dansheng-ffi", "tools/dansheng-lab"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["chrono04"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "io-std", "signal", "fs", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "multipart", "cookies", "socks", "stream", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
url = { version = "2", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
